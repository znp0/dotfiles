# Default config: https://sw.kovidgoyal.net/kitty/_downloads/433dadebd0bf504f8b008985378086ce/kitty.conf
# or https://sw.kovidgoyal.net/kitty/conf/#sample-kitty-conf if the above link didn't work

font_family family="Dank Mono P"
font_size 13.0
bold_font auto
italic_font auto
bold_italic_font auto
modify_font cell_height 150%

cursor_shape beam
cursor_trail 1
window_padding_width 30
confirm_os_window_close 0

enable_audio_bell false

allow_remote_control yes
listen_on unix:/tmp/kitty.sock

map --allow-fallback=shifted,ascii ctrl+c copy_or_noop
map --allow-fallback=shifted,ascii ctrl+v paste_from_clipboard
map --when-focus-on var:in_editor --allow-fallback=shifted,ascii ctrl+c
map --when-focus-on var:in_editor --allow-fallback=shifted,ascii ctrl+v
# Disable job suspension
map --allow-fallback=shifted,ascii ctrl+z discard_event

# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME
